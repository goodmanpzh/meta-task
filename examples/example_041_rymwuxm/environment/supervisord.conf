[unix_http_server]
file=/run/supervisor.sock

[supervisord]
logfile=/app/logs/supervisord.log
pidfile=/run/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; === Queue Server ===
; BUG 1: command path is wrong (uses /app/services/ instead of /app/)
; BUG 2: QUEUE_BIND_ADDR is set to 10.0.0.1 (unreachable) instead of 127.0.0.1
[program:queue]
command=python3 /app/services/queue_server.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/queue-stdout.log
stderr_logfile=/app/logs/queue-stderr.log
environment=QUEUE_ENQUEUE_PORT="9100",QUEUE_DEQUEUE_PORT="9101",QUEUE_STATS_PORT="9102",QUEUE_BIND_ADDR="10.0.0.1",QUEUE_DATA_DIR="/app/data/queue",QUEUE_SOCKET_PATH="/run/pipeline/queue.sock"
priority=100

; === Worker ===
; BUG 3: user is set to "pipeline" which doesn't exist
; BUG 4: QUEUE_DEQUEUE_PORT is wrong (9201 instead of 9101)
; BUG 5: WORKER_USE_SOCKET=true but socket has wrong permissions (set by queue_server.py chmod 0o600 as root)
; BUG 6: file descriptor limit (ulimit) is too low - set via environment mechanism
[program:worker]
command=python3 /app/worker.py
directory=/app
user=pipeline
autostart=true
autorestart=true
stdout_logfile=/app/logs/worker-stdout.log
stderr_logfile=/app/logs/worker-stderr.log
environment=QUEUE_HOST="127.0.0.1",QUEUE_DEQUEUE_PORT="9201",WORKER_USE_SOCKET="true",QUEUE_SOCKET_PATH="/run/pipeline/queue.sock",WORKER_RESULTS_DIR="/app/data/results",WORKER_LOG_DIR="/app/logs",WORKER_ID="worker-0"
priority=200
startsecs=3

; === Aggregator ===
; BUG 7: AGGREGATOR_OUTPUT points to /tmp/pipeline-out/results.json which is on a tiny tmpfs
; BUG 8: EXPECTED_JOBS is wrong (25 instead of 20)
; BUG 9: WORKER_RESULTS_DIR doesn't match worker's output dir (uses /app/results vs /app/data/results)
[program:aggregator]
command=python3 /app/aggregator.py
directory=/app
autostart=true
autorestart=false
stdout_logfile=/app/logs/aggregator-stdout.log
stderr_logfile=/app/logs/aggregator-stderr.log
environment=WORKER_RESULTS_DIR="/app/results",AGGREGATOR_OUTPUT="/tmp/pipeline-out/results.json",QUEUE_STATS_PORT="9102",QUEUE_HOST="127.0.0.1",EXPECTED_JOBS="25",AGGREGATOR_LOG_DIR="/app/logs"
priority=300
startsecs=3
startretries=3
